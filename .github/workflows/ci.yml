name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The published entry point must import under plain Node, not just tsc.
      - name: Smoke-test the built entry point
        run: node -e "import('./dist/index.js').then(m => { if (!Object.keys(m).length) process.exit(1); console.log('exports:', Object.keys(m).length); })"
