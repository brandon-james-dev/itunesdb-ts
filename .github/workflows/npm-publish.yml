name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual "Run workflow" button (retry/resume publishing)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout the code
      id-token: write # The OIDC ID token is used for authentication and for provenance
      # The keyless authentication to npm is authorized by this OIDC token —
      # no NODE_AUTH_TOKEN secret is used.
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      # `npm publish` runs the prepublishOnly script (lint + build + test),
      # so publishing is blocked unless all checks pass.
      - name: Publish to npm (Trusted Publishing)
        run: npm publish --provenance --access public
