name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual "Run workflow" button (retry/resume publishing)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      # `npm publish` runs the prepublishOnly script (lint + build + test),
      # so publishing is blocked unless all checks pass.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
